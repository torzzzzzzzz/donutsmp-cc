name: Build Windows installer
on:
  push:
    branches: [claude/great-lovelace-d0dsez]
    paths: ['nero-tweaks/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nero-tweaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Nero-Tweaks-Installer
          path: nero-tweaks/dist/*.exe
